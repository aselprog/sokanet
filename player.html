<!-- player.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SokaNet Player</title>
  <link href="https://vjs.zencdn.net/8.0.4/video-js.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #02422B;
      font-family: Arial, sans-serif;
      color: white;
    }

    .header {
      background-color: #03006c;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .player-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 100px); /* 100px for header + back button */
    }

    .back-button {
      display: inline-block;
      margin: 10px 20px;
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }

    .video-js {
      width: 100%;
      max-width: 960px;
      height: auto;
    }
  </style>
</head>
<body>

  <div class="header" id="channelName">Loading...</div>

  <div class="player-container">
    <video
      id="m3u8Player"
      class="video-js vjs-default-skin"
      controls
      autoplay
      preload="auto"
      playsinline
      data-setup="{}">
      <source id="videoSource" src="" type="application/x-mpegURL">
      Your browser does not support the video tag.
    </video>
  </div>

  <a class="back-button" href="index.html">⟵ Back to Home</a>

  <script src="https://vjs.zencdn.net/8.0.4/video.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const url = params.get("url");
    const name = params.get("name");

    if (url && name) {
      document.getElementById("videoSource").src = url;
      document.getElementById("channelName").textContent = name;

      const player = videojs("m3u8Player");
      player.ready(() => {
        player.src({ type: "application/x-mpegURL", src: url });
        player.play();
      });
    } else {
      document.getElementById("channelName").textContent = "Invalid or Missing Channel";
    }
  </script>
</body>
</html>
