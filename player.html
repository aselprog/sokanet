<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Now Playing</title>
  <link href="https://vjs.zencdn.net/8.0.4/video-js.css" rel="stylesheet" />
  <style>
    body {
      background-color: #02422B;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h2 {
      margin-bottom: 20px;
    }

    .video-container {
      margin-top: 200px;
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #02422B;
    }

    video {
      position: relative;
      width: 90%;
      max-width: 1000px;
      aspect-ratio: 16/9;
      border-radius: 10px;
      overflow: hidden;
      background-color: #02422B;
    }
    #m3u8Player {
      width: 100%;
      height: 40%;
      background-color: #02422B;
      border: solid;
    }

    .back-button {
      display: inline-block;
      position: fixed;
      top: 10px;
      left: 10px;
      padding: 10px 16px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      z-index: 1000;
    }

    .back-button:hover {
      background-color: #0056b3;
    }
    #channelName{
      margin-top: 100px;
    }
  </style>
</head>
<body>
  <div class="main">

  <h2 id="channelName">Now Playing</h2>

  <div class="video-container">
    <video id="m3u8Player" class="video-js vjs-default-skin" controls autoplay preload="auto"></video>
  </div>

  <a href="index.html" class="back-button">⬅ Back</a>
</div>

  <script src="https://vjs.zencdn.net/8.0.4/video.min.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoUrl = urlParams.get('url');
    const channelName = urlParams.get('name') || 'Now Playing';

    document.getElementById('channelName').textContent = channelName;

    const player = videojs('m3u8Player');

    if (videoUrl) {
      player.src({ src: videoUrl, type: 'application/x-mpegURL' });
      player.ready(() => {
        player.play();
      });
    } else {
      document.getElementById('channelName').textContent = 'Error: No video URL provided.';
    }
  </script>
</body>
</html>
