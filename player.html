<!-- player.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Player</title>
  <link href="https://vjs.zencdn.net/8.0.4/video-js.css" rel="stylesheet" />
  <style>
    body {
      background-color: #000;
      margin: 0;
      padding: 0;
      color: white;
      font-family: Arial, sans-serif;
    }
    .header {
      background-color: #03006c;
      padding: 10px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }
    .video-container {
      padding: 10px;
    }
    .back-button {
      margin: 10px;
      display: inline-block;
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="header" id="channelName">Loading...</div>

  <div class="video-container">
    <video id="my-video" class="video-js vjs-default-skin" controls autoplay width="100%" height="auto">
      <source id="videoSource" src="" type="application/x-mpegURL" />
      Your browser does not support the video tag.
    </video>
  </div>

  <a class="back-button" href="index.html">⟵ Back to Channels</a>

  <script src="https://vjs.zencdn.net/8.0.4/video.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const url = params.get("url");
    const name = params.get("name");

    if (url && name) {
      document.getElementById("videoSource").src = url;
      document.getElementById("channelName").textContent = name;
      const player = videojs("my-video");
      player.src({ type: "application/x-mpegURL", src: url });
    } else {
      document.getElementById("channelName").textContent = "Invalid channel URL";
    }
  </script>
</body>
</html>
