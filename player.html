<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SokaNet Player</title>
  <!-- Video.js CSS -->
  <link href="https://vjs.zencdn.net/8.0.4/video-js.css" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #02422B;
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      background-color: #03006c;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .player-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .video-js {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16/9;
      border-radius: 10px;
      border: 0.5px solid;
      box-shadow: 0 0 10px rgba(0,0,0,0.6);
    }

    .back-button {
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      margin: 15px auto;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      text-align: center;
      width: fit-content;
      display: block;
    }

    .back-button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="header" id="channelName">Loading...</div>

  <div class="player-container">
    <video
      id="m3u8Player"
      class="video-js vjs-default-skin"
      controls
      playsinline
      preload="auto"
      data-setup="{}">
      <source id="videoSource" src="" type="application/x-mpegURL">
      Your browser does not support the video tag.
    </video>
  </div>

  <a class="back-button" href="index.html">⟵ Back to Home</a>

  <!-- Video.js Script -->
  <script src="https://vjs.zencdn.net/8.0.4/video.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const url = params.get("url");
    const name = params.get("name");

    const source = document.getElementById("videoSource");
    const channelName = document.getElementById("channelName");

    if (url && name) {
      source.src = url;
      channelName.textContent = name;

      const player = videojs("m3u8Player");
      player.ready(() => {
        player.src({ type: "application/x-mpegURL", src: url });
      });
    } else {
      channelName.textContent = "Invalid or Missing Channel Info";
    }
  </script>
</body>
</html>
