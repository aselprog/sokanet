<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>SokaNet Player</title>

  <link href="https://vjs.zencdn.net/8.0.4/video-js.css" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #02422B;
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .player-container {
      position: relative;
      width: 100%;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .video-js {
      width: 100% !important;
      height: auto !important;
      aspect-ratio: 16 / 9;
      background-color: black;
    }

    .overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    .play-button {
      background-color: #007bff;
      color: white;
      font-size: 20px;
      padding: 10px 25px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .channel-name {
      background-color: #03006c;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .back-button {
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      margin: 20px auto;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      text-align: center;
      width: fit-content;
      display: block;
    }

    .back-button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <!-- VIDEO PLAYER -->
  <div class="player-container">
    <video
      id="m3u8Player"
      class="video-js vjs-default-skin"
      controls
      playsinline
      webkit-playsinline
      preload="auto"
      data-setup="{}">
      <source id="videoSource" src="" type="application/x-mpegURL">
      Your browser does not support the video tag.
    </video>

    <!-- OVERLAY FOR PLAY BUTTON -->
    <div id="overlay" class="overlay">
      <button class="play-button" onclick="startPlayback()">▶ Gusa kuanza</button>
    </div>
  </div>

  <!-- CHANNEL NAME -->
  <div class="channel-name" id="channelName">Loading...</div>

  <!-- BACK BUTTON -->
  <a class="back-button" href="index.html">⟵ Back to Home</a>

  <!-- Video.js Script -->
  <script src="https://vjs.zencdn.net/8.0.4/video.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const url = params.get("url");
    const name = params.get("name");

    const source = document.getElementById("videoSource");
    const channelName = document.getElementById("channelName");
    const overlay = document.getElementById("overlay");

    if (url && name) {
      source.src = url;
      channelName.textContent = decodeURIComponent(name);
    } else {
      channelName.textContent = "Invalid or Missing Channel Info";
    }

    const player = videojs("m3u8Player");

    function startPlayback() {
      overlay.style.display = "none";
      player.src({ type: "application/x-mpegURL", src: url });
      player.play().catch(e => {
        alert("Imeshindikana kuplay video. Jaribu tena.");
        console.error("Play error:", e);
      });
    }
  </script>
</body>
</html>
