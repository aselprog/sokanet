<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Now Playing</title>
  <link href="https://vjs.zencdn.net/8.0.4/video-js.css" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #000;
      color: white;
      text-align: center;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), rgba(2, 66, 43, 0.9));
      z-index: -1;
    }

    .main-content {
      position: relative;
      z-index: 1;
      padding: 20px;
    }

    h2 {
      margin-top: 100px;
      margin-bottom: 30px;
      font-size: 26px;
      text-shadow: 1px 1px 4px #000;
    }

    .video-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    video {
      width: 100%;
      max-width: 1000px;
      aspect-ratio: 16/9;
      border-radius: 12px;
      overflow: hidden;
      background-color: #000;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }

    #m3u8Player {
      width: 100%;
      background-color: #000;
      border: 1px solid #333;
    }

    .back-button {
      position: fixed;
      top: 15px;
      left: 15px;
      padding: 10px 18px;
      background-color: #28a745;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      z-index: 1000;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.6);
      transition: background-color 0.3s;
    }

    .back-button:hover {
      background-color: #218838;
    }

    @media (max-width: 600px) {
      h2 {
        font-size: 20px;
        margin-top: 80px;
      }

      .back-button {
        font-size: 13px;
        padding: 8px 14px;
      }
    }
  </style>
</head>
<body>

  <div class="overlay"></div>

  <a href="index.html" class="back-button">⬅ Back</a>

  <div class="main-content">
    <h2 id="channelName">Now Playing</h2>

    <div class="video-container">
      <video id="m3u8Player" class="video-js vjs-default-skin" controls autoplay muted playsinline preload="auto"></video>
    </div>
  </div>

  <script src="https://vjs.zencdn.net/8.0.4/video.min.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoUrl = urlParams.get('url');
    const channelName = urlParams.get('name') || 'Now Playing';

    document.getElementById('channelName').textContent = channelName;

    const player = videojs('m3u8Player');

    if (videoUrl) {
      player.src({ src: videoUrl, type: 'application/x-mpegURL' });
      player.ready(() => {
        player.play();
      });
    } else {
      document.getElementById('channelName').textContent = 'Error: No video URL provided.';
    }
  </script>
</body>
</html>
