<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Now Playing</title>
  <link href="https://vjs.zencdn.net/8.0.4/video-js.css" rel="stylesheet"/>
  <style>
    body {
        background-color: #02422B;
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
    }

    .player-wrapper {
      position: relative;
      width: 100%;
      max-width: 1000px;
      margin: 30px auto;
      aspect-ratio: 16/9;
    }

    video {
      width: 100%;
      height: 100%;
    }

    .back-button {
      display: inline-block;
      margin: 15px;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .loader-wrapper {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 1000;
    }

    .loader {
      width: 80px;
      height: 80px;
      border: 10px solid transparent;
      border-top: 10px solid white;
      border-bottom: 10px solid #007bff;
      border-radius: 50%;
      animation: spin 1.5s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <h2 id="channelName">Loading...</h2>
  <a href="index.html" class="back-button">⬅ Back to Home</a>

  <div class="loader-wrapper" id="loadingSpinner">
    <div class="loader"></div>
  </div>

  <div class="player-wrapper">
    <video id="m3u8Player" class="video-js vjs-default-skin" controls autoplay preload="auto"></video>
  </div>

  <script src="https://vjs.zencdn.net/8.0.4/video.min.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoUrl = urlParams.get('url');
    const channelName = urlParams.get('name') || 'Now Playing';

    document.getElementById('channelName').textContent = channelName;

    const loadingSpinner = document.getElementById('loadingSpinner');
    const player = videojs('m3u8Player');

    if (videoUrl) {
      loadingSpinner.style.display = 'flex';
      player.src({ src: videoUrl, type: 'application/x-mpegURL' });
      player.ready(() => {
        player.play();
      });
      player.on("loadeddata", () => {
        loadingSpinner.style.display = 'none';
      });
    } else {
      document.getElementById('channelName').textContent = 'Error: No video URL provided.';
    }
  </script>
</body>
</html>
