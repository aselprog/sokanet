<!-- player.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SokaNet</title>
  <link href="https://vjs.zencdn.net/8.0.4/video-js.css" rel="stylesheet" />
  <style>
    body {
      background-color: #02422B;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      color: white;
    }

    .header {
      background-color: #03006c;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background-color: black;
      border: 0.5px solid;
    }

    .video-js {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
    }

    .back-button {
      margin: 15px;
      display: inline-block;
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="header" id="channelName">Loading...</div>

  <div class="video-wrapper">
    <video
      id="my-video"
      class="video-js vjs-default-skin"
      controls
      autoplay
      playsinline
      preload="auto"
    >
      <source id="videoSource" src="" type="application/x-mpegURL" />
      Your browser does not support the video tag.
    </video>
  </div>

  <a class="back-button" href="index.html">⟵ Back to Home</a>

  <script src="https://vjs.zencdn.net/8.0.4/video.min.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const url = params.get("url");
    const name = params.get("name");

    if (url && name) {
      document.getElementById("videoSource").src = url;
      document.getElementById("channelName").textContent = name;
      const player = videojs("my-video");

      player.ready(() => {
        player.src({ type: "application/x-mpegURL", src: url });
        // Attempt to play
        player.play().catch((error) => {
          console.warn("Autoplay with sound failed:", error);
          alert("Click the video to start playing with sound.");
        });
      });
    } else {
      document.getElementById("channelName").textContent = "Invalid channel URL";
    }
  </script>
</body>
</html>
